<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- A coarse honeycomb: it shows on large renders and melts away at tab size. -->
    <pattern id="hex" width="51.962" height="90.000" patternUnits="userSpaceOnUse">
      <path d="M0 15.000L25.981 0L51.962 15.000V45.000L25.981 60.000L0 45.000Z M25.981 60.000V90.000" fill="none" stroke="#000" stroke-width="3"/>
    </pattern>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2cc"/>
      <stop offset="55%" stop-color="#ffd98a"/>
      <stop offset="100%" stop-color="#f4b94d"/>
    </linearGradient>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <path id="mark" fill-rule="evenodd" d="M240 195 Q512 167 784 195 Q819 420 784 647 Q512 675 240 647 Q205 420 240 195 Z M324 281 Q512 270 700 281 L704 375 Q512 372 320 375 Z M320 469 Q416 472 512 469 L512 566 Q416 566 324 562 Z M240 738h363v90H240zM693 738h90v90h-90z"/>
    <clipPath id="markclip"><use href="#mark"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="180" fill="#08090b"/>
  <use href="#mark" fill="#f0a93a" fill-opacity="0.8" filter="url(#halo)"/>
  <use href="#mark" fill="#ffd27a" fill-opacity="0.7" filter="url(#bloom)"/>
  <use href="#mark" fill="url(#lit)"/>
  <g clip-path="url(#markclip)"><rect width="1024" height="1024" fill="url(#hex)" opacity="0.28"/></g>
</svg>
