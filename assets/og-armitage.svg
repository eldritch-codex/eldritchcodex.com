  <text x="72" y="356" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="30" fill="#d9a75c" filter="url(#vfd-glow)">Source-grounded agent, skillset and CLI</text>

  <text font-family="IBM Plex Sans" font-size="21" fill="#b7b4ac">
    <tspan x="72" y="440">How I use coding agents without giving up learning from first principles. It runs on</tspan>
    <tspan x="72" y="472">Pi, reads your Zotero library and works in Zed through a custom ACP adapter. Every</tspan>
    <tspan x="72" y="504">factual claim must point to a source, or it is cut or marked unverified.</tspan>
  </text>

